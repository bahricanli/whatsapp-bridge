name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '8.*', php: '7.4', testbench: '^6.0' }
          - { laravel: '9.*', php: '8.0', testbench: '^7.0' }
          - { laravel: '10.*', php: '8.1', testbench: '^8.0' }
          - { laravel: '11.*', php: '8.2', testbench: '^9.0' }
          - { laravel: '12.*', php: '8.2', testbench: '^10.0' }
          - { laravel: '13.*', php: '8.3', testbench: '^11.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require --dev --no-interaction --no-update "orchestra/testbench:${{ matrix.testbench }}"
      - run: composer update --prefer-dist --no-interaction
      - run: composer test
